name: deploy-pages

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch: {}
  # The refresh job pushes data with GITHUB_TOKEN, and GitHub never lets those
  # pushes trigger other workflows, so chain the deploy off the refresh run instead.
  workflow_run:
    workflows: ["refresh-data"]
    types: [completed]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # Deploys after every refresh, even a failed one: data is never overwritten by a bad run,
  # and status.json must reach the page so the footer can show a degraded state.
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Check ratings and search before publishing
        run: node build/check-rating.mjs && node build/check-universe.mjs && node build/check-report.mjs
      - name: Stamp file references with the commit, so each release loads as one set
        run: node build/stamp.mjs "$(git rev-parse --short=12 HEAD)"
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v5
