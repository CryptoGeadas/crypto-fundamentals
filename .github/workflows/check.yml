name: check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  rating:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Shared rating module gives the expected results in Node
        run: node build/check-rating.mjs
      - name: Universe build and search behave as specified
        run: node build/check-universe.mjs
      - name: Run report, sanity checks and alert decisions behave as specified
        run: node build/check-report.mjs
