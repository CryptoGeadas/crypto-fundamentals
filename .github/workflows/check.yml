name: check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  rating:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Every check suite (build/check-*.mjs) passes
        run: for f in build/check-*.mjs; do echo "== $f"; node "$f" || exit 1; done
