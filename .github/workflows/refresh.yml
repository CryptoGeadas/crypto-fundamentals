name: refresh-data

on:
  schedule:
    - cron: "0 6 * * *"   # daily, 06:00 UTC
  workflow_dispatch:
    inputs:
      simulate_problem:
        description: "Add a harmless simulated problem (tests the alert issue)"
        type: boolean
        default: false

permissions:
  contents: write   # commit refreshed data
  issues: write     # keep the "Daily update problems" issue in sync

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Check the build logic before touching data
        run: node build/check-universe.mjs && node build/check-report.mjs

      # Writes data only when it passes its sanity checks; always writes status.json.
      # A crash still writes status.json and then fails the job (GitHub's failure email).
      - name: Build the verified universe and identifier map
        env:
          SIMULATE_PROBLEM: ${{ inputs.simulate_problem && '1' || '0' }}
        run: node build/build-universe.mjs

      - name: Commit data and status
        if: always()
        run: |
          git config user.name "fundamentals-bot"
          git config user.email "actions@users.noreply.github.com"
          git add site/data/*.json
          if git diff --cached --quiet; then
            echo "no change"
          else
            git commit -m "data: daily refresh ($(date -u +%FT%TZ))"
            git push
          fi

      - name: Report problems to the "Daily update problems" issue
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node build/alert.mjs
