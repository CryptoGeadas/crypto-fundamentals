name: refresh-data

on:
  schedule:
    - cron: "17 6 * * *"    # daily, 06:17 UTC (off the top of the hour, which GitHub delays most)
    - cron: "17 14 * * *"   # catch-up; either slot builds only if today's data wasn't built (build/should-build.mjs)
  workflow_dispatch:
    inputs:
      simulate_problem:
        description: "Add a harmless simulated problem (tests the alert issue)"
        type: boolean
        default: false

permissions:
  contents: write   # commit refreshed data
  issues: write     # keep the "Daily update problems" issue in sync

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.decide.outputs.build }}
    steps:
      # Latest main, not the trigger-time commit: a queued or late run must see what earlier runs committed.
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Build today? (scheduled runs skip when today's data already exists)
        id: decide
        env:
          EVENT: ${{ github.event_name }}
        run: node build/should-build.mjs | tee -a "$GITHUB_OUTPUT"

  refresh:
    needs: gate
    if: needs.gate.outputs.build == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Check the build logic before touching data
        run: for f in build/check-*.mjs; do node "$f" || exit 1; done

      # Writes data only when it passes its sanity checks; always writes status.json.
      # A crash still writes status.json and then fails the job (GitHub's failure email).
      - name: Build the data (universe, identifier map, unlocks)
        env:
          SIMULATE_PROBLEM: ${{ inputs.simulate_problem && '1' || '0' }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}   # GitHub API for development activity; no new keys
        run: node build/daily.mjs

      - name: Commit data and status
        if: always()
        run: |
          git config user.name "fundamentals-bot"
          git config user.email "actions@users.noreply.github.com"
          git add site/data
          if git diff --cached --quiet; then
            echo "no change"
          else
            git commit -m "data: daily refresh ($(date -u +%FT%TZ))"
            git pull --rebase origin main   # code may have been pushed while the job ran
            git push
          fi

      - name: Report problems to the "Daily update problems" issue
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node build/alert.mjs

      - name: Keep the "Data drift" issue in sync with the self-audit
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node build/audit-issue.mjs
