name: refresh-data

on:
  schedule:
    - cron: "0 6 * * *"   # daily, 06:00 UTC
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Check the build logic before touching data
        run: node build/check-universe.mjs

      - name: Build the verified universe and identifier map
        run: node build/build-universe.mjs

      - name: Commit data if changed
        run: |
          git config user.name "fundamentals-bot"
          git config user.email "actions@users.noreply.github.com"
          git add site/data/universe.json site/data/idmap.json
          if git diff --cached --quiet; then
            echo "no change"
          else
            git commit -m "data: refresh universe and identifier map ($(date -u +%FT%TZ))"
            git push
          fi
